<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>りにゅうしょく ストック</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="head-main">
          <div class="title round">
            <svg class="leaf" viewBox="0 0 24 24" fill="none">
              <path d="M4 20C4 11 11 4 20 4c0 9-7 16-16 16Z" fill="#5AA24E" />
              <path d="M5 19C9 14 14 10 18 8" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            りにゅうしょく ストック
          </div>
          <div class="date" id="today"></div>
        </div>
        <button class="share-chip" id="shareBtn" hidden>🔗 共有する</button>
      </header>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-ingredients" aria-selected="true" data-tab="ingredients">食材</button>
        <button class="tab" role="tab" id="tab-stock" aria-selected="false" data-tab="stock">在庫</button>
        <button class="tab" role="tab" id="tab-log" aria-selected="false" data-tab="log">あげたきろく</button>
      </div>

      <div id="view-ingredients"></div>
      <div id="view-stock" hidden></div>
      <div id="view-log" hidden>
        <div id="recommendBox"></div>
        <div id="historyBox"></div>
      </div>
    </div>

    <div class="actions">
      <div class="inner">
        <button class="btn btn-make" id="makeBtn">＋ つくる</button>
        <button class="btn btn-serve" id="serveBtn">🥄 あげる</button>
      </div>
    </div>

    <!-- make sheet -->
    <div class="scrim" id="makeScrim">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="ストックをつくる">
        <div class="grab"></div>
        <h2>ストックをつくる</h2>
        <label>カテゴリ</label>
        <div class="seg seg-cat" id="makeCat"></div>
        <label>どれから作る？</label>
        <div class="picks" id="makePicks"></div>
        <input id="makeCustom" placeholder="リストにないものは ここに入力" style="margin-top: 10px" />
        <div id="makeUse" hidden>
          <label>この食材を使った量</label>
          <div class="stepper">
            <button data-step="makeUseQty" data-dir="-1" aria-label="へらす">−</button>
            <input id="makeUseQty" type="number" value="1" min="0" inputmode="numeric" />
            <button data-step="makeUseQty" data-dir="1" aria-label="ふやす">＋</button>
            <span id="makeUseUnit" class="step-unit"></span>
          </div>
          <p class="note" id="makeUseHint" style="margin-top: 6px"></p>
        </div>
        <label>できたストックの数</label>
        <div class="stepper">
          <button data-step="makeQty" data-dir="-1" aria-label="へらす">−</button>
          <input id="makeQty" type="number" value="8" min="1" inputmode="numeric" />
          <button data-step="makeQty" data-dir="1" aria-label="ふやす">＋</button>
          <span class="step-unit">個</span>
        </div>
        <label>ほぞん方法</label>
        <div class="seg" id="makeStore">
          <button aria-pressed="true" data-v="冷蔵">冷蔵（れいぞう）</button>
          <button aria-pressed="false" data-v="冷凍">冷凍（れいとう）</button>
        </div>
        <label>つくった日</label>
        <input id="makeDate" type="date" />
        <button class="save" id="makeSave">ストックに追加</button>
        <p class="note">
          めやす：冷蔵は2日くらい、冷凍は1週間くらいで使い切りましょう。鮮度は「つくった日」をもとに表示されます。最終的なあげる・あげないの判断はご自身でお願いします。
        </p>
      </div>
    </div>

    <!-- ingredient sheet -->
    <div class="scrim" id="ingScrim">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="食材">
        <div class="grab"></div>
        <h2 id="ingTitle">野菜の食材を追加</h2>
        <label>野菜の名前</label>
        <div class="picks" id="ingPicks"></div>
        <input id="ingName" placeholder="または じぶんで入力（例：かぶ）" style="margin-top: 10px" />
        <label>数・量</label>
        <div class="stepper">
          <button data-step="ingQty" data-dir="-1" aria-label="へらす">−</button>
          <input id="ingQty" type="number" value="1" min="0" inputmode="numeric" />
          <button data-step="ingQty" data-dir="1" aria-label="ふやす">＋</button>
          <select id="ingUnit" class="unit-sel" aria-label="単位">
            <option>本</option><option>個</option><option>株</option><option>束</option>
            <option>袋</option><option>パック</option><option>g</option><option>その他</option>
          </select>
        </div>
        <label>ほぞん場所</label>
        <div class="seg" id="ingStore">
          <button aria-pressed="true" data-v="冷蔵">冷蔵</button>
          <button aria-pressed="false" data-v="冷凍">冷凍</button>
          <button aria-pressed="false" data-v="常温">常温</button>
        </div>
        <label>使い切りたい日（任意）</label>
        <input id="ingExpire" type="date" />
        <button class="save" id="ingSave">保存する</button>
        <p class="note">「使い切りたい日」を入れると、残り日数と期限の色が表示されます。</p>
      </div>
    </div>

    <!-- serve sheet -->
    <div class="scrim" id="serveScrim">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="あげる">
        <div class="grab"></div>
        <h2>きょう あげた分</h2>
        <label>いつ あげた？</label>
        <div class="seg" id="serveSlot">
          <button data-v="朝" aria-pressed="false">🌅 朝</button>
          <button data-v="昼" aria-pressed="false">🌞 昼</button>
          <button data-v="晩" aria-pressed="false">🌙 晩</button>
        </div>
        <label style="margin-top: 18px">やさい</label>
        <div id="serveList"></div>
        <button class="save" id="serveSave" disabled>きろくする</button>
        <p class="note">古いストックから自動でへらします（先に作った分から使います）。</p>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="src/logic.js"></script>
    <script src="src/app.js"></script>
    <script type="module" src="src/sync.js"></script>
  </body>
</html>
